name: Android Debug APK Build & Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compile Debug APK & Publish Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Android SDK & Accept Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/distributions
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Gradle 9.3.1
        run: |
          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$HOME/.gradle/distributions/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then
            mkdir -p "$HOME/.gradle/distributions"
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d "$HOME/.gradle/distributions"
            rm -f /tmp/gradle.zip
          fi
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

      - name: Prepare Environment & Firebase Configuration
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            python3 -c '
          import json
          cfg = {
            "project_info": {
              "project_number": "934594495030",
              "project_id": "gen-lang-client-0825214929",
              "storage_bucket": "gen-lang-client-0825214929.firebasestorage.app"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:934594495030:android:c0251f90b612c4e4e78e97",
                "android_client_info": {"package_name": "com.aistudio.obsidiansudoku.kxrqza"}
              },
              "oauth_client": [{
                "client_id": "934594495030-j698aipggbd3llb2s69s0decc2936efa.apps.googleusercontent.com",
                "client_type": 3
              }],
              "api_key": [{"current_key": "AIzaSyDummyKeyForGitHubActionsBuild00000"}],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": [{
                    "client_id": "934594495030-j698aipggbd3llb2s69s0decc2936efa.apps.googleusercontent.com",
                    "client_type": 3
                  }]
                }
              }
            }],
            "configuration_version": "1"
          }
          with open("app/google-services.json", "w") as f:
              json.dump(cfg, f, indent=2)
          '
          fi

      - name: Compile Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-sudoku-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG_NAME="debug-build-${{ github.run_number }}-${SHORT_SHA}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }} (${SHORT_SHA})"
          NOTES="Automated debug APK build from branch \`${{ github.ref_name }}\` (commit \`${{ github.sha }}\`)."

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_FILE" --clobber
          else
            gh release create "$TAG_NAME" "$APK_FILE" \
              --target "${{ github.sha }}" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi
